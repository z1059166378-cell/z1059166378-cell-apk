name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install buildozer cython

      - name: Setup Android SDK (Cmdline Tools + Licenses)
        run: |
          # 1. 定义 SDK 根目录 (Buildozer 默认路径)
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools

          # 2. 下载最新版 Android Command Line Tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          # 重命名为 latest (这是标准目录结构)
          mv cmdline-tools latest
          rm cmdline-tools.zip

          # 3. 配置环境变量，让 sdkmanager 可用
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH

          # 4. 创建 licenses 目录并写入通用许可证哈希值 (绕过 yes | sdkmanager --licenses)
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license

          # 5. (可选) 预安装 build-tools，防止 Buildozer 调用时出错
          # 使用 --verbose 以便调试，如果不需要可去掉
          sdkmanager --list > /dev/null 2>&1 && echo "sdkmanager is ready" || echo "sdkmanager check failed"

      - name: Build APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH

          # 运行 Buildozer
          # 它现在应该能找到 sdkmanager 并读取到已接受的许可证
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asphalt9-helper-apk
          path: bin/*.apk
