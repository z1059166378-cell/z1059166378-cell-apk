name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install buildozer cython

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Initialize Buildozer
        run: |
          # 初始化 buildozer.spec（如果仓库里没有）
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi

          # 关键：先执行一次 deploy 来下载 python-for-android
          # 这会创建 .buildozer/android/platform/python-for-android 目录
          buildozer android debug deploy

      - name: Build APK
        run: |
          # 现在正式构建
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asphalt9-helper-apk
          path: bin/*.apk
